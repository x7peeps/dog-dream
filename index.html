/* ==========================================================

// Repeatable art direction: all procedural placement uses a seeded generator.

/* 柔和圆形光点贴图（星星 / 星尘，避免方块穿帮） */

}

    float shadow=1.-smoothstep(.03,.3,luminance);

  bloom.setSize(innerWidth*.5,innerHeight*.5);
}
let frameAverage=1/60,perfSeconds=0,readyFrames=0,qualityReduced=LOW;
const perfSamples=[];let slowWindows=0;
function reduceQuality(){
  if(FORCED_FX||qualityReduced)return;
  qualityReduced=true;postEnabled=false;
  renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);

  // Preserve clump count and coverage; simplify only the distant silhouettes.
  for(const grass of grassMeshes)if(grass.userData.farGeometry)grass.geometry=grass.userData.farGeometry;

/* ============ R1 · Sky: indigo zenith / lavender air / directional dusk ============ */
const skyMat = new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{top:{value:new THREE.Color('#272f5c')}, mid:{value:new THREE.Color('#6472a4')},
    horizon:{value:new THREE.Color('#cfa2c6')}, warm:{value:new THREE.Color('#ffe0a8')}},
  vertexShader:`varying vec3 vDir; void main(){vDir=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`
    varying vec3 vDir; uniform vec3 top,mid,horizon,warm;
    void main(){
      vec3 d=normalize(vDir);float h=d.y;
      vec3 col=mix(horizon,mid,smoothstep(-.06,.20,h));
      col=mix(col,top,smoothstep(.06,.50,h));
      float dusk=exp(-pow((h+.015)*8.,2.))*smoothstep(-.45,.8,d.x)*.85;
      col=mix(col,warm,dusk);
      col=mix(col,vec3(.22,.23,.36),(1.-smoothstep(-.5,-.03,h)));
      col+=(fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453)-.5)/650.;

});
const sky=new THREE.Mesh(new THREE.SphereGeometry(500,48,32),skyMat); scene.add(sky);
const starTime={value:0};
function makeStarLayer(count,size,opacity,color,rMin,rMax,bright=false){
  const pos=new Float32Array(count*3),phases=new Float32Array(count);
  for(let i=0;i<count;i++){
    phases[i]=random()*6.28;
    const a=random()*Math.PI*2,u=.12+random()*.84,r=rMin+random()*(rMax-rMin),q=Math.sqrt(1-u*u);
    pos.set([Math.cos(a)*q*r,u*r,Math.sin(a)*q*r],i*3);

  const mat=new THREE.PointsMaterial({color,size,map:bright?brightStarTexture():softPointTexture(.06),transparent:true,opacity,
    blending:THREE.AdditiveBlending,depthWrite:false,fog:false});

    shader.uniforms.uStarTime=starTime;

const moonDir=new THREE.Vector3(-.34,.40,-1).normalize();

/* ============ R7 · Cold key, warm local sources, distance-limited diffuse bounce ============ */
const fillLight=new THREE.HemisphereLight(0xb6c3f0,0x62718d,.98);scene.add(fillLight);

const coolBounce=new THREE.DirectionalLight(0xb9c6ea,.78);coolBounce.position.set(-25,25,45);scene.add(coolBounce);
const lampLights=[];
const lightField={orb:{value:new THREE.Vector3(-3.15,5.6,2)},
  lampA:{value:new THREE.Vector3(13,25,-60)},lampB:{value:new THREE.Vector3(37,25,-61)},
  garden:{value:new THREE.Vector3(24,21,-63)}};
// Diffuse bounce is evaluated on actual world-space surfaces, including instanced blades.
// Its compact support keeps distant objects cool; real point lights provide the directional response.
function warmBounce(material,gain=1){
  const previous=material.onBeforeCompile;

    if(previous)previous.call(material,shader);
    shader.uniforms.dreamOrb=lightField.orb;shader.uniforms.dreamLampA=lightField.lampA;
    shader.uniforms.dreamLampB=lightField.lampB;shader.uniforms.dreamGarden=lightField.garden;

      #include <worldpos_vertex>

      #include <emissivemap_fragment>

/* ============ R2 · A sloping meadow, falling into the cloud valley ============ */
const JOURNEY_RADIUS=250;
const journeyRoute=[[0,12],[-6,-3],[-16,-18],[-22,-25],[-14,-27],[-9,-43],[16,-45],[35,-43],[29,-66],[10,-89],[-13,-112],[0,-127],[5,-132],[6,-140],[4,-151],[5,-171],[0,-187.5]];

function smoothBand(a,b,x){const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);}
function routeDistance(x,z){
  let distance=Infinity;
  for(let i=1;i<journeyRoute.length;i++){
    const a=journeyRoute[i-1],b=journeyRoute[i],dx=b[0]-a[0],dz=b[1]-a[1];
    const t=clamp(((x-a[0])*dx+(z-a[1])*dz)/(dx*dx+dz*dz),0,1);

function tick(){
  requestAnimationFrame(tick);

    readyFrames++;perfSeconds+=rawDt;
    // Exclude shader compilation, asset startup and the first 120 ready frames.
    if(readyFrames>120 && perfSeconds>5 && !FORCED_FX && !qualityReduced){
      perfSamples.push(rawDt);
      if(perfSamples.length===120){
        frameAverage=perfSamples.reduce((a,b)=>a+b,0)/120;perfSamples.length=0;
        slowWindows=frameAverage>.024?slowWindows+1:0;
        if(slowWindows>=2)reduceQuality();
      }
    }
  }
  elapsed += dt;
  for(const m of mixers) m.update(dt);

  /* —— 玩家移动 —— */
  if(!paused){
  const wish = new THREE.Vector3();
  if(keys.has('KeyW')) wish.z-=1;
  if(keys.has('KeyS')) wish.z+=1;
  if(keys.has('KeyA')) wish.x-=1;
  if(keys.has('KeyD')) wish.x+=1;
  if(wish.lengthSq()>0) wish.normalize().applyAxisAngle(UP, player.yaw);
  const sprint = keys.has('ShiftLeft')||keys.has('ShiftRight');
  const target = wish.multiplyScalar(sprint ? 10.5 : 6);
  const k = 1 - Math.exp(-dt*8);
  player.vel.x += (target.x-player.vel.x)*k;
  player.vel.z += (target.z-player.vel.z)*k;
  player.pos.x += player.vel.x*dt;
  player.pos.z += player.vel.z*dt;
  const rNow = Math.hypot(player.pos.x, player.pos.z);
  if(rNow > JOURNEY_RADIUS){ player.pos.x *= JOURNEY_RADIUS/rNow; player.pos.z *= JOURNEY_RADIUS/rNow; }

  /* 跳跃 */
  if(keys.has('Space') && player.onGround){ player.vy = 5.2; player.onGround = false; }
  if(!player.onGround){
    player.vy -= 15*dt;
    player.jy = Math.max(0, player.jy + player.vy*dt);
    if(player.jy === 0 && player.vy < 0){ player.vy = 0; player.onGround = true; }
  }

  }
  /* —— 相机 + 步行起伏 —— */
  const speed = Math.hypot(player.vel.x, player.vel.z);
  bobPhase += dt * (4.5 + speed*1.3);
  const bob = player.onGround ? Math.sin(bobPhase)*.045*clamp(speed/6,0,1.2) : 0;
  const baseY = groundY(player.pos.x, player.pos.z) + eyeHeight();
  camY += (baseY + player.jy + bob - camY) * Math.min(1, dt*14);
  camera.position.set(player.pos.x, camY + (speed<.1?Math.sin(elapsed*.32)*.025:0), player.pos.z);
  camera.quaternion.setFromEuler(new THREE.Euler(player.pitch+portraitPitch, player.yaw, 0, 'YXZ'));

  /* —— 氛围 —— */
  const t = elapsed;
  windUniform.value=t;
  starTime.value=t;
  const pa = dust.pts.geometry.attributes.position;
  for(let i=0;i<dust.N;i++){
    const j=i*3;
    pa.array[j+1] = dust.base[j+1] + Math.sin(t*.5 + dust.phase[i])*.7;
    pa.array[j]   = dust.base[j]   + Math.sin(t*.13 + dust.phase[i]*1.7)*.8;
    pa.array[j+2] = dust.base[j+2] + Math.cos(t*.11 + dust.phase[i])*.8;
  }
  pa.needsUpdate = true;

  /* 漂浮群岛（缓慢起伏 + 自转） */
  for(const m of islands){
    m.position.y = m.userData.baseY + Math.sin(t*.35 + m.userData.ph)*m.userData.amplitude;
    m.rotation.y += m.userData.spin*dt;
  }

  /* 薄雾呼吸 */
  for(const s of mists){
    const u = s.userData;
    s.position.x = u.baseX + Math.sin(t*.045 + u.ph)*1.2;
    s.material.opacity = u.baseOp * (.85 + .15*Math.sin(t*.3 + u.ph));
  }

  /* 信标呼吸 */
  beacon.position.y = beaconBase + Math.sin(t*.9)*.025;
  beaconMat.uniforms.uTime.value=t;
  sparks.rotation.y=t*.09;
  lightField.orb.value.copy(beacon.position);lightField.garden.value.copy((assembledHero||heroIsland).position);
  if(assemblyLightPool.length){
    const near=glowAnchors.slice().sort((a,b)=>a.position.distanceToSquared(camera.position)-b.position.distanceToSquared(camera.position));
    assemblyLightPool.forEach((light,i)=>{const source=near[i];light.intensity=source?.intensity||0;if(source){light.position.copy(source.position);light.distance=source.distance;}});
  }
  heroIsland.updateMatrixWorld(true);
  lampLights[0].getWorldPosition(lightField.lampA.value);lampLights[1].getWorldPosition(lightField.lampB.value);
  const pulse = 4.0 + Math.sin(t*1.3)*.14;
  beaconHalo.scale.set(pulse, pulse, 1);

  /* 礼物 */
  for(const p of pickups.children.slice()){
    const u = p.userData;
    if(u.dying){
      u.t += dt; const kk = Math.min(u.t/.45, 1);
      p.scale.setScalar(1 + kk*1.1);
      p.children[0].material.opacity = 1-kk;
      p.children[1].material.opacity = (1-kk)*.32;
      if(kk>=1) pickups.remove(p);
      continue;
    }
    p.position.y = u.baseY + Math.sin(t*1.5 + u.phase)*.14;
    const dx = p.position.x-player.pos.x, dz = p.position.z-player.pos.z;
    if(!paused && dx*dx+dz*dz < 2.6 && Math.abs(p.position.y - (camY-eyeHeight())) < 2.4){
      u.dying = true; u.t = 0; collected++;
      giftsEl.textContent = `礼物 ${collected} / 5`;
    }
  }


  renderer.info.reset();
  if(postEnabled)composer.render();else renderer.render(scene,camera);
  if(assetState.ready)renderer.shadowMap.autoUpdate=false;
  if(mixers.length && (++shadowTick % 3 === 0)) renderer.shadowMap.needsUpdate = true;
  window.__ready = assetState.ready;
}

/* ============ 启动 ============ */
loadWorld().finally(()=>{ assetState.ready=true;ovStatus.textContent = RAW ? '' : '点击，进入它的梦';
  if(QUERY.has('dbg')) document.title = 'DBG assets '+assetState.loaded+'/'+assetState.requested+' failed='+assetState.failed+' :: '+((assetState.failedNames||[]).join(' | ')); });

addEventListener('resize', ()=>{
  fitOpeningCamera();
  renderer.setSize(innerWidth, innerHeight);
  if(composer){composer.setSize(innerWidth,innerHeight);bloom.setSize(innerWidth*.5,innerHeight*.5);}
});



function focusPoint(position){
  const p=position.clone().project(camera);
  return {x:(p.x+1)/2,y:(1-p.y)/2,z:p.z,insideViewport:Math.abs(p.x)<1&&Math.abs(p.y)<1&&p.z>-1&&p.z<1};
}
window.__dreamDebug=()=>({player:player.pos.toArray(),jump:player.jy,yaw:player.yaw,pitch:player.pitch,paused,
  quality:{mode:FX_MODE,forced:FORCED_FX,adaptive:!FORCED_FX,readyFrames,warmupDone:readyFrames>120&&perfSeconds>5,low:qualityReduced,bloom:postEnabled,grass:grassMeshes.reduce((n,g)=>n+g.count,0)},
  camera:{fov:camera.fov,aspect:camera.aspect,portraitLift,portraitPitch},
  focus:{moon:focusPoint(moon.position),beacon:focusPoint(beacon.position),island:focusPoint((assembledHero||heroIsland).position.clone().add(new THREE.Vector3(0,4,0)))},
  render:{calls:renderer.info.render.calls,triangles:renderer.info.render.triangles},assets:{...assetState},
  animation:{mixers:mixers.length,times:mixers.map(m=>m.time),clips:[...assetClips]},
  layout:{radius:JOURNEY_RADIUS,route:journeyRoute.map(p=>[...p]),assets:assetRecords.map(a=>({index:a.index,name:a.name,zone:a.zone,position:a.root.position.toArray(),bounds:a.bounds}))}});
tick();
</script>
